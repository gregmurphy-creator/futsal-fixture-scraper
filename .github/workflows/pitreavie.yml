name: Pitreavie 7s Fixtures

on:
  # The league adds the new Saturday tab on a Wednesday or Thursday, so check
  # hourly across Wed, Thu and Fri. Friday is the safety net: a tab that slips
  # a day would otherwise go unseen until the following week, by which point
  # the Saturday has gone.
  schedule:
    - cron: '0 * * * 3,4,5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pitreavie-fixtures
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependency install: the scraper reads the shared workbook with the
      # Python standard library alone, and only ever issues GET requests.
      - name: Read the league workbook
        id: scrape
        env:
          PITREAVIE_SHARE_URL: ${{ secrets.PITREAVIE_SHARE_URL }}
        run: python pitreavie_scraper.py

      - name: Commit updated fixtures
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pitreavie_data.json; then
            echo "No fixture changes to commit."
            exit 0
          fi
          git add pitreavie_data.json
          git commit -m "Pitreavie 7s: ${{ steps.scrape.outputs.week_tab }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # A phone push is the alert that actually arrives. GitHub's own
      # notifications depend on watch settings and email deliverability, both
      # of which silently swallowed the first week's alert. ntfy has neither:
      # the topic name is the only configuration, and it is held as a secret
      # because anyone who knows it can read these notifications.
      - name: Push a phone notification
        if: steps.scrape.outputs.new_week == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEEK: ${{ steps.scrape.outputs.week_tab }}
          OUR_COUNT: ${{ steps.scrape.outputs.our_count }}
          SUMMARY: ${{ steps.scrape.outputs.summary }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC is not set - skipping the push."
            exit 0
          fi
          printf '%s\n' "${SUMMARY}" | tr '|' '\n' | sed 's/^ *//;s/ *$//' > push.txt
          curl --retry 3 --retry-delay 2 -fsS \
            -H "Title: ${WEEK} - ${OUR_COUNT} Tiki Taka games" \
            -H "Click: https://www.ttfixtures.uk/football/" \
            -H "Tags: soccer" \
            --data-binary @push.txt \
            "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null
          echo "Pushed to ntfy."

      # The issue is kept as a written record per week, independent of whether
      # its notification ever reaches an inbox.
      #
      - name: Raise an issue for the new week
        if: steps.scrape.outputs.new_week == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ steps.scrape.outputs.week_tab }}
          HEADING: ${{ steps.scrape.outputs.heading }}
          OUR_COUNT: ${{ steps.scrape.outputs.our_count }}
          SUMMARY: ${{ steps.scrape.outputs.summary }}
        run: |
          {
            echo "**${HEADING}** fixtures are up."
            echo
            echo "Tiki Taka matches this week: **${OUR_COUNT}**"
            echo
            echo "${SUMMARY}" | tr '|' '\n' | sed 's/^ *//;s/^/- /'
            echo
            echo "Full list: https://www.ttfixtures.uk/football/"
            echo
            echo "_Close this issue once you have read it - a new one is raised each week._"
            echo
            echo "cc @${GITHUB_REPOSITORY_OWNER}"
          } > body.md
          gh issue create \
            --title "Pitreavie 7s: ${WEEK} fixtures are up" \
            --body-file body.md \
            --assignee "${GITHUB_REPOSITORY_OWNER}"
