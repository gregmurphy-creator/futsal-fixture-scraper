name: Futsal Fixtures Scraper

on:
  # Minute 43, not 0: GitHub drops scheduled runs when busy, worst on the
  # hour, and 43 keeps clear of the 7s check at 17.
  schedule:
    - cron: '43 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fixtures-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependency install step: the scraper reads LeagueLobster's schedule
      # backend using only the Python standard library. There is no Playwright
      # and no browser download, which is what used to make this job slow and
      # flaky (headless Chromium saw an empty, htmx-populated schedule
      # container and captured 0 fixtures).

      - name: Run scraper
        id: scrape
        run: python scraper.py

      # The season was published in one go, so a change here means a fixture
      # has been rearranged - worth knowing, and easy to miss in 975 of them.
      # Only our own teams raise a push; everything else still updates quietly.
      - name: Push a phone notification
        if: steps.scrape.outputs.changed == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TITLE: ${{ steps.scrape.outputs.title }}
          CHANGES: ${{ steps.scrape.outputs.changes }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC is not set - skipping the push."
            exit 0
          fi
          printf '%s\n' "${CHANGES}" | tr '|' '\n' | sed 's/^ *//;s/ *$//' > push.txt
          curl --retry 3 --retry-delay 2 -fsS \
            -H "Title: ${TITLE:-FUTSAL FIXTURE CHANGE}" \
            -H "Click: https://www.ttfixtures.uk/futsal/" \
            -H "Tags: warning" \
            -H "Priority: high" \
            --data-binary @push.txt \
            "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null
          echo "Pushed to ntfy."

      - name: Commit and push updated fixtures data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- fixtures_data.json; then
            echo "No fixture changes to commit."
            exit 0
          fi
          git add fixtures_data.json
          git commit -m "Auto-update fixtures data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
