<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiki Taka - Winter Futsal 2026/27</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-6 pb-24">
    
    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-gray-900">
          Tiki Taka <span class="text-[#FF6600]">-</span> Winter Futsal
        </h1>
        <p class="text-sm text-gray-500 font-medium">Match Fixtures 2026/27</p>
      </div>
      <button id="openPlayerModalBtn" class="px-3 py-1.5 text-xs font-bold bg-[#FF6600] text-white rounded-xl shadow-sm hover:bg-[#e05a00] flex items-center gap-1.5 transition-all">
        <span>👤</span> Manage Players
      </button>
    </header>

    <!-- Player Profiles Bar -->
    <div id="playerPillsContainer" class="flex items-center gap-2 overflow-x-auto pb-2 mb-3 scrollbar-none"></div>

    <!-- Quick Team / Venue Search Bar -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3 mb-4">
      <div class="relative flex items-center">
        <span class="absolute left-3 text-gray-400 text-sm">🔍</span>
        <input
          id="teamSearchInput"
          type="text"
          placeholder="Search team or venue (e.g. Swifts, Inverkeithing, Beath)..."
          class="w-full pl-9 pr-10 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#FF6600] transition-all"
        />
        <button
          id="clearSearchBtn"
          class="hidden absolute right-3 text-gray-400 hover:text-gray-700 text-sm font-bold bg-gray-200 hover:bg-gray-300 rounded-full w-5 h-5 flex items-center justify-center leading-none"
        >
          &times;
        </button>
      </div>
    </div>

    <!-- Quick Views (Tiki Taka Default Toggle + Dates) -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3 mb-4">
      <div class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-2 px-1">Quick Views</div>
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="dateFilterGroup">
        <button id="toggleTikiBtn" class="py-2 px-3 text-xs font-bold rounded-xl bg-[#FF6600] text-white shadow-sm flex-shrink-0 transition-all">
          ✓ Tiki Taka
        </button>
        <div class="w-px h-6 bg-gray-200 mx-1 flex-shrink-0"></div>
        <button data-datefilter="ALL" class="date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-900 text-white shadow-sm flex-shrink-0">All Dates</button>
        <button data-datefilter="NEXT_MATCHDAY" class="date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0">Next Matchday</button>
        <button data-datefilter="FOLLOWING_WEEKEND" class="date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0">Following Weekend</button>
      </div>
    </div>

    <!-- League Filter Tabs -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-3 scrollbar-none" id="leagueFilters">
      <button data-league="ALL" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-[#FF6600] text-white shadow-sm flex-shrink-0">All Leagues</button>
      <button data-league="Liga 5" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 flex-shrink-0">Liga 5</button>
      <button data-league="Liga 6" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 flex-shrink-0">Liga 6</button>
      <button data-league="Liga 7" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 flex-shrink-0">Liga 7</button>
    </div>

    <!-- Status Subheader -->
    <div class="flex items-center justify-between mb-3 px-1">
      <span id="matchCount" class="text-xs font-medium text-gray-500">Connecting to schedule...</span>
    </div>

    <!-- Fixture List -->
    <div id="fixturesList" class="space-y-3"></div>
  </div>

  <!-- PLAYER MANAGEMENT MODAL -->
  <div id="playerModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-gray-200">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-black text-gray-900">Manage Players & Children</h3>
        <button id="closePlayerModalBtn" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 mb-5">
        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Add Child to Team</h4>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Child's Name</label>
            <input id="newChildName" type="text" placeholder="e.g. Leo" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#FF6600] bg-white" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">
              Squads <span class="font-normal text-gray-500">- tick every squad they play for</span>
            </label>
            <input id="squadSearchInput" type="text" placeholder="Filter squads..." class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#FF6600] bg-white" />
            <div id="squadPicker" class="mt-2 max-h-44 overflow-y-auto border border-gray-300 rounded-xl bg-white"></div>
            <p class="mt-1.5 text-[11px] text-gray-500 leading-snug">
              Squad names repeat across ligas - Tiki Taka Blanco plays in Liga 5, 6 and 7 as three different squads - so pick the right liga.
            </p>
          </div>
          <button id="savePlayerBtn" class="w-full py-2.5 text-xs font-bold bg-[#FF6600] text-white rounded-xl shadow-sm hover:bg-[#e05a00] transition-all">
            Save Player
          </button>
        </div>
      </div>

      <div>
        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Saved Players</h4>
        <div id="savedPlayersList" class="space-y-2 max-h-48 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script>
    let allFixtures = [];
    let searchQuery = "";
    let selectedLeague = "ALL";
    let selectedDateFilter = "ALL";
    let onlyTikiTaka = true;
    let selectedPlayerId = null;
    let players = [];
    let squadFilterQuery = "";
    let clashNotes = new Map();

    const PLAYERS_STORAGE_KEY = "tiki_saved_players";

    // A squad is a (team, league) pair, never a team name on its own: the same
    // name fields a different set of kids in each liga.
    function squadKey(squad) {
      return `${squad.team}|||${squad.league}`;
    }

    function makePlayerId() {
      return `p${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
    }

    // Saved players used to be one row per squad ({ name, team, league }), so a
    // child in two squads showed up as two children. They are now
    // { id, name, squads: [...] }; old rows fold together on name once, here.
    function migratePlayers(stored) {
      if (!Array.isArray(stored)) return [];
      const byName = new Map();

      stored.forEach(entry => {
        if (!entry || !entry.name) return;
        const name = String(entry.name).trim();
        if (!name) return;

        const key = name.toLowerCase();
        if (!byName.has(key)) byName.set(key, { id: makePlayerId(), name, squads: [] });
        const player = byName.get(key);

        const squads = Array.isArray(entry.squads)
          ? entry.squads
          : (entry.team ? [{ team: entry.team, league: entry.league }] : []);

        squads.forEach(squad => {
          if (!squad || !squad.team) return;
          const clean = { team: String(squad.team), league: String(squad.league || "") };
          if (!player.squads.some(s => squadKey(s) === squadKey(clean))) player.squads.push(clean);
        });
      });

      return Array.from(byName.values()).filter(player => player.squads.length > 0);
    }

    function savePlayers() {
      try {
        localStorage.setItem(PLAYERS_STORAGE_KEY, JSON.stringify(players));
      } catch (e) {}
    }

    function selectedPlayer() {
      return players.find(player => player.id === selectedPlayerId) || null;
    }

    try {
      players = migratePlayers(JSON.parse(localStorage.getItem(PLAYERS_STORAGE_KEY) || "[]"));
      savePlayers();
    } catch (e) {
      players = [];
    }

    const fixturesContainer = document.getElementById("fixturesList");
    const matchCount = document.getElementById("matchCount");
    const toggleTikiBtn = document.getElementById("toggleTikiBtn");
    const searchInput = document.getElementById("teamSearchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");

    const playerModal = document.getElementById("playerModal");
    const openPlayerModalBtn = document.getElementById("openPlayerModalBtn");
    const closePlayerModalBtn = document.getElementById("closePlayerModalBtn");
    const savePlayerBtn = document.getElementById("savePlayerBtn");
    const newChildName = document.getElementById("newChildName");
    const squadPicker = document.getElementById("squadPicker");
    const squadSearchInput = document.getElementById("squadSearchInput");
    const savedPlayersList = document.getElementById("savedPlayersList");
    const playerPillsContainer = document.getElementById("playerPillsContainer");

    function isTiki(team = "") {
      const s = String(team || "").toLowerCase();
      return s.includes("tiki") || s.includes("taka");
    }

    function escapeHtml(str = "") {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Normalises round + date for every match. The scraper supplies both
    // (including the two-week Christmas break, which simple weekly
    // arithmetic gets wrong from round 8 on), so they are used as-is and
    // only reconstructed when absent.
    function processFixtures(rawFixtures) {
      const startDate = new Date(2026, 10, 7); // Saturday, November 7, 2026
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      function getSuffix(d) {
        if (d >= 11 && d <= 13) return "th";
        const rem = d % 10;
        if (rem === 1) return "st";
        if (rem === 2) return "nd";
        if (rem === 3) return "rd";
        return "th";
      }

      const leagueIndices = {};

      return rawFixtures.map(item => {
        const lg = item.league || "Unknown";
        leagueIndices[lg] = (leagueIndices[lg] || 0) + 1;
        const idx = leagueIndices[lg] - 1;

        // The feed now carries a real round number for every fixture, read
        // from the league's own schedule. Only derive one if it is missing,
        // which is the case for feed files written before that change.
        let roundNum = Number(item.round);
        if (!Number.isFinite(roundNum) || roundNum < 1) {
          const matchesPerRound = { "Liga 5": 15, "Liga 6": 14, "Liga 7": 5 };
          roundNum = Math.floor(idx / (matchesPerRound[lg] || 5)) + 1;
        }

        let formattedDate = item.date;
        if (!formattedDate || formattedDate === "Upcoming") {
          const matchDate = new Date(startDate.getTime());
          matchDate.setDate(matchDate.getDate() + (roundNum - 1) * 7);
          const d = matchDate.getDate();
          const suf = getSuffix(d);
          const m = monthNames[matchDate.getMonth()];
          formattedDate = `Sat ${d}${suf} ${m}`;
        }

        return {
          ...item,
          round: roundNum,
          date: formattedDate
        };
      });
    }

    // Matchdays still to come, soonest first, as ISO date strings. Every
    // league plays the same Saturdays, so one list covers them all.
    function upcomingMatchdays() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      return Array.from(
        new Set(allFixtures.map(item => item.iso_date).filter(Boolean))
      )
        .filter(iso => {
          const date = new Date(`${iso}T00:00:00`);
          return !isNaN(date.getTime()) && date >= today;
        })
        .sort();
    }

    // Every (team, league) pair in the feed. The pair is the unit of identity:
    // Liga 5 Blanco and Liga 6 Blanco are different squads of kids that happen
    // to share a name, each playing their own 15-match season.
    function allSquads() {
      const squads = new Map();
      allFixtures.forEach(item => {
        const league = item.league || "Unknown";
        [item.homeTeam, item.awayTeam].forEach(team => {
          if (!team || team === "TBD") return;
          squads.set(`${team}|||${league}`, { team, league });
        });
      });
      return Array.from(squads.values()).sort((a, b) =>
        a.league.localeCompare(b.league) || a.team.localeCompare(b.team)
      );
    }

    function pendingSquadKeys() {
      if (!squadPicker) return new Set();
      return new Set(
        Array.from(squadPicker.querySelectorAll("input[type=checkbox]:checked"))
          .map(input => input.value)
      );
    }

    function populateSquadPicker(preselected) {
      if (!squadPicker) return;
      const checked = preselected || pendingSquadKeys();
      const q = squadFilterQuery.toLowerCase().trim();
      const squads = allSquads().filter(squad =>
        !q || squad.team.toLowerCase().includes(q) || squad.league.toLowerCase().includes(q)
      );

      if (squads.length === 0) {
        squadPicker.innerHTML = `<p class="p-3 text-xs text-gray-400 italic">No squads match that filter.</p>`;
        return;
      }

      let html = "";
      let currentLeague = null;
      squads.forEach(squad => {
        if (squad.league !== currentLeague) {
          currentLeague = squad.league;
          html += `<div class="px-3 py-1.5 bg-gray-100 text-[10px] font-extrabold uppercase tracking-wider text-gray-600">${escapeHtml(currentLeague)}</div>`;
        }
        const key = squadKey(squad);
        html += `
          <label class="flex items-center gap-2.5 px-3 py-2 text-xs cursor-pointer hover:bg-orange-50 border-t border-gray-100">
            <input type="checkbox" value="${escapeHtml(key)}" class="accent-[#FF6600]" ${checked.has(key) ? "checked" : ""} />
            <span class="font-semibold text-gray-800">${escapeHtml(squad.team)}</span>
          </label>`;
      });
      squadPicker.innerHTML = html;
    }

    // Does this child turn out for this fixture? Both halves of the squad pair
    // must match, so a Liga 5 Blanco player is not shown Liga 6 Blanco games.
    function playsIn(player, fixture) {
      return player.squads.some(squad =>
        squad.league === fixture.league &&
        (squad.team === fixture.homeTeam || squad.team === fixture.awayTeam)
      );
    }

    function timeToMinutes(time) {
      const parts = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(time || "").trim());
      if (!parts) return null;
      let hours = Number(parts[1]) % 12;
      if ((parts[3] || "").toUpperCase() === "PM") hours += 12;
      return hours * 60 + Number(parts[2]);
    }

    // One slot is 45 minutes, so two kick-offs inside that at different venues
    // mean a dash across Fife.
    const TIGHT_TURNAROUND_MINUTES = 45;

    // Where one child's squads are both out on the same day: an identical
    // kick-off is an outright clash, a near-identical one at another venue is a
    // tight turnaround. Returns fixture id -> notes.
    function computeClashes() {
      const notes = new Map();
      const addNote = (fixture, note) => {
        if (!notes.has(fixture.id)) notes.set(fixture.id, []);
        notes.get(fixture.id).push(note);
      };

      players.forEach(player => {
        const byDate = new Map();
        allFixtures.forEach(fixture => {
          if (!fixture.id || !playsIn(player, fixture)) return;
          const day = fixture.iso_date || fixture.date;
          if (!byDate.has(day)) byDate.set(day, []);
          byDate.get(day).push(fixture);
        });

        byDate.forEach(dayFixtures => {
          for (let i = 0; i < dayFixtures.length; i++) {
            for (let j = i + 1; j < dayFixtures.length; j++) {
              const a = dayFixtures[i];
              const b = dayFixtures[j];
              const aMinutes = timeToMinutes(a.time);
              const bMinutes = timeToMinutes(b.time);
              if (aMinutes === null || bMinutes === null) continue;

              const gap = Math.abs(aMinutes - bMinutes);
              let type = null;
              if (gap === 0) type = "clash";
              else if (gap <= TIGHT_TURNAROUND_MINUTES && a.venue !== b.venue) type = "tight";
              if (!type) continue;

              addNote(a, { playerId: player.id, playerName: player.name, type, other: b });
              addNote(b, { playerId: player.id, playerName: player.name, type, other: a });
            }
          }
        });
      });

      return notes;
    }

    function refreshClashes() {
      clashNotes = computeClashes();
    }

    // Each clash is recorded against both fixtures, so halve the tally.
    function playerClashCount(player) {
      let hits = 0;
      clashNotes.forEach(noteList => {
        noteList.forEach(note => {
          if (note.playerId === player.id && note.type === "clash") hits++;
        });
      });
      return Math.round(hits / 2);
    }

    function renderPlayerPills() {
      if (!playerPillsContainer) return;
      if (players.length === 0) {
        playerPillsContainer.innerHTML = `
          <button onclick="document.getElementById('openPlayerModalBtn').click()" class="text-xs font-semibold text-gray-500 bg-white border border-dashed border-gray-300 px-3 py-1.5 rounded-xl hover:border-gray-400">
            + Tap to Add Your Child's Team
          </button>
        `;
        return;
      }

      let html = `
        <button onclick="selectPlayer(null)" class="px-3 py-1.5 text-xs font-bold rounded-xl transition-all flex-shrink-0 ${
          selectedPlayerId === null ? 'bg-black text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200'
        }">
          All Squads
        </button>
      `;

      players.forEach(player => {
        const active = selectedPlayerId === player.id;
        const squadCount = player.squads.length;
        const clashes = playerClashCount(player);
        html += `
          <button onclick="selectPlayer('${player.id}')" class="px-3 py-1.5 text-xs font-bold rounded-xl transition-all whitespace-nowrap flex items-center gap-1.5 flex-shrink-0 ${
            active ? 'bg-[#FF6600] text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200'
          }">
            <span>👦</span> ${escapeHtml(player.name)}
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${active ? 'bg-white/25' : 'bg-gray-100 text-gray-600'}">
              ${squadCount} squad${squadCount === 1 ? '' : 's'}
            </span>
            ${clashes ? `<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded ${active ? 'bg-white/25' : 'bg-red-100 text-red-700'}">⚠ ${clashes}</span>` : ''}
          </button>
        `;
      });

      playerPillsContainer.innerHTML = html;
    }

    window.selectPlayer = function(playerId) {
      selectedPlayerId = playerId;
      renderPlayerPills();
      renderFixtures();
    };

    function renderSavedPlayersModalList() {
      if (!savedPlayersList) return;
      if (players.length === 0) {
        savedPlayersList.innerHTML = `<p class="text-xs text-gray-400 italic">No players added yet.</p>`;
        return;
      }

      savedPlayersList.innerHTML = players.map((player, playerIndex) => `
        <div class="p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs">
          <div class="flex items-center justify-between gap-2">
            <span class="font-bold text-gray-900">${escapeHtml(player.name)}</span>
            <button onclick="deletePlayer(${playerIndex})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">
              Remove
            </button>
          </div>
          <div class="mt-1.5 flex flex-wrap gap-1.5">
            ${player.squads.map((squad, squadIndex) => `
              <span class="inline-flex items-center gap-1.5 bg-white border border-gray-200 rounded-lg px-2 py-1">
                <span class="font-semibold text-gray-800">${escapeHtml(squad.team)}</span>
                <span class="text-[10px] font-extrabold text-[#FF6600]">${escapeHtml(squad.league)}</span>
                <button onclick="removeSquad(${playerIndex}, ${squadIndex})" title="Remove this squad"
                        class="text-gray-400 hover:text-red-600 font-bold leading-none">&times;</button>
              </span>`).join("")}
          </div>
        </div>
      `).join("");
    }

    function afterPlayersChanged() {
      savePlayers();
      refreshClashes();
      renderSavedPlayersModalList();
      renderPlayerPills();
      renderFixtures();
    }

    window.deletePlayer = function(playerIndex) {
      const removed = players[playerIndex];
      players.splice(playerIndex, 1);
      if (removed && selectedPlayerId === removed.id) selectedPlayerId = null;
      afterPlayersChanged();
    };

    // Dropping a child's last squad removes the child: a player with no squad
    // would match nothing and sit there as a dead pill.
    window.removeSquad = function(playerIndex, squadIndex) {
      const player = players[playerIndex];
      if (!player) return;
      player.squads.splice(squadIndex, 1);
      if (player.squads.length === 0) {
        players.splice(playerIndex, 1);
        if (selectedPlayerId === player.id) selectedPlayerId = null;
      }
      afterPlayersChanged();
    };

    function renderFixtures() {
      if (!fixturesContainer || !matchCount) return;

      const q = searchQuery.toLowerCase().trim();
      const matchdays = upcomingMatchdays();
      const activePlayer = selectedPlayer();
      const hasAnyTiki = allFixtures.some(item => isTiki(item.homeTeam) || isTiki(item.awayTeam));
      const activeTikiFilter = onlyTikiTaka && hasAnyTiki;

      const filtered = allFixtures.filter(item => {
        const home = item.homeTeam || "";
        const away = item.awayTeam || "";
        const venue = item.venue || "";
        const league = item.league || "";

        const matchLeague = selectedLeague === "ALL" || league === selectedLeague;
        const containsTiki = isTiki(home) || isTiki(away);
        
        const matchesSearch = !q || (
          home.toLowerCase().includes(q) ||
          away.toLowerCase().includes(q) ||
          venue.toLowerCase().includes(q)
        );

        const matchesPlayer = !activePlayer || playsIn(activePlayer, item);

        let matchesDate = true;
        if (selectedDateFilter === "NEXT_MATCHDAY") {
          matchesDate = matchdays.length
            ? item.iso_date === matchdays[0]
            : item.round === 1;
        } else if (selectedDateFilter === "FOLLOWING_WEEKEND") {
          matchesDate = matchdays.length > 1
            ? item.iso_date === matchdays[1]
            : item.round === 2;
        }

        if (!matchLeague) return false;
        if (activeTikiFilter && !activePlayer && !containsTiki) return false;
        if (!matchesSearch) return false;
        if (!matchesPlayer) return false;
        if (!matchesDate) return false;
        return true;
      });

      matchCount.textContent = `Showing ${filtered.length} matches`;

      if (filtered.length === 0) {
        fixturesContainer.innerHTML = `
          <div class="bg-white rounded-2xl p-10 text-center border border-gray-200">
            <p class="text-gray-500 font-medium">No matches found for the selected filters.</p>
            <button onclick="resetFilters()" class="mt-3 px-3 py-1.5 text-xs font-bold bg-[#FF6600] text-white rounded-xl shadow-sm">
              Show All Matches
            </button>
          </div>`;
        return;
      }

      fixturesContainer.innerHTML = filtered.map(item => {
        const home = item.homeTeam || "TBD";
        const away = item.awayTeam || "TBD";
        const venue = item.venue || "TBD";
        const time = item.time || "TBD";
        const date = item.date || "Sat 7th Nov";
        const league = item.league || "Fixture";

        const cardNotes = clashNotes.get(item.id) || [];
        const hasHardClash = cardNotes.some(note => note.type === "clash");

        const homeIsTiki = isTiki(home);
        const awayIsTiki = isTiki(away);
        const isTikiMatch = homeIsTiki || awayIsTiki;

        const team1 = (awayIsTiki && !homeIsTiki) ? away : home;
        const team2 = (awayIsTiki && !homeIsTiki) ? home : away;
        const team1IsTiki = isTiki(team1);
        const team2IsTiki = isTiki(team2);

        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venue + ', Fife, Scotland')}`;
        const calTitle = encodeURIComponent(`${home} vs ${away} (${league})`);
        const calDetails = encodeURIComponent(`Futsal Escocia match on ${date} at ${time}.`);
        const calLoc = encodeURIComponent(venue);
        const calUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${calTitle}&location=${calLoc}&details=${calDetails}`;

        return `
          <div class="bg-white rounded-2xl p-4 border ${
            hasHardClash
              ? 'border-l-4 border-l-red-500 border-gray-200 shadow-sm'
              : (isTikiMatch ? 'border-l-4 border-l-[#FF6600] border-gray-200 shadow-sm' : 'border-gray-200')
          }">
            <div class="flex items-center justify-between mb-3">
              <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 border border-gray-200">
                ${escapeHtml(league)}
              </span>
              <span class="text-[11px] font-bold bg-orange-50 text-[#FF6600] px-2.5 py-1 rounded-lg border border-orange-100 flex items-center gap-1 shadow-sm">
                📅 ${escapeHtml(date)} · ${escapeHtml(time)}
              </span>
            </div>

            ${cardNotes.length ? `
            <div class="mb-2 space-y-1">
              ${cardNotes.map(note => `
                <div class="flex items-start gap-1.5 text-[11px] font-bold px-2.5 py-1.5 rounded-lg border ${
                  note.type === 'clash'
                    ? 'bg-red-50 text-red-700 border-red-200'
                    : 'bg-amber-50 text-amber-800 border-amber-200'
                }">
                  <span class="flex-shrink-0">${note.type === 'clash' ? '⚠️' : '⏱️'}</span>
                  <span>
                    ${escapeHtml(note.playerName)} ${note.type === 'clash' ? 'also plays' : 'is also due'}
                    ${escapeHtml(note.other.homeTeam)} v ${escapeHtml(note.other.awayTeam)}
                    at ${escapeHtml(note.other.time)} · ${escapeHtml(note.other.venue)}
                    <span class="font-semibold opacity-80">(${escapeHtml(note.other.league)})</span>
                  </span>
                </div>`).join("")}
            </div>` : ""}

            <div class="my-2 p-3 bg-gray-50 rounded-xl border border-gray-100 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${team1IsTiki ? 'bg-[#FF6600]' : 'bg-gray-300'}"></span>
                  <span class="text-sm truncate ${team1IsTiki ? 'font-black text-gray-900' : 'font-semibold text-gray-800'}">${escapeHtml(team1)}</span>
                </div>
                ${team1IsTiki ? '<span class="text-[10px] font-extrabold uppercase bg-orange-100 text-[#FF6600] px-1.5 py-0.5 rounded flex-shrink-0">Tiki</span>' : ''}
              </div>

              <div class="flex items-center gap-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest px-1">
                <span class="h-px bg-gray-200 flex-1"></span>
                <span>vs</span>
                <span class="h-px bg-gray-200 flex-1"></span>
              </div>

              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${team2IsTiki ? 'bg-[#FF6600]' : 'bg-gray-300'}"></span>
                  <span class="text-sm truncate ${team2IsTiki ? 'font-black text-gray-900' : 'font-semibold text-gray-700'}">${escapeHtml(team2)}</span>
                </div>
                ${team2IsTiki ? '<span class="text-[10px] font-extrabold uppercase bg-orange-100 text-[#FF6600] px-1.5 py-0.5 rounded flex-shrink-0">Tiki</span>' : ''}
              </div>
            </div>

            <div class="pt-2 flex flex-wrap items-center justify-between gap-2">
              <div class="text-xs text-gray-500 font-medium">📍 ${escapeHtml(venue)}</div>
              <div class="flex items-center gap-2">
                <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700">Directions</a>
                <a href="${calUrl}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-orange-500 hover:bg-orange-600 text-white">+ Calendar</a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    window.resetFilters = function() {
      selectedLeague = "ALL";
      selectedDateFilter = "ALL";
      selectedPlayerId = null;
      searchQuery = "";
      onlyTikiTaka = false;
      if (searchInput) searchInput.value = "";
      if (toggleTikiBtn) {
        toggleTikiBtn.textContent = "All Teams";
        toggleTikiBtn.className = "py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0 transition-all";
      }
      renderPlayerPills();
      renderFixtures();
    };

    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        if (clearSearchBtn) clearSearchBtn.classList.toggle("hidden", !searchQuery);
        renderFixtures();
      });
    }

    if (clearSearchBtn) {
      clearSearchBtn.addEventListener("click", () => {
        if (searchInput) searchInput.value = "";
        searchQuery = "";
        clearSearchBtn.classList.add("hidden");
        renderFixtures();
      });
    }

    if (openPlayerModalBtn && playerModal) {
      openPlayerModalBtn.addEventListener("click", () => {
        squadFilterQuery = "";
        if (squadSearchInput) squadSearchInput.value = "";
        populateSquadPicker(new Set());
        renderSavedPlayersModalList();
        playerModal.classList.remove("hidden");
      });
    }

    if (closePlayerModalBtn && playerModal) {
      closePlayerModalBtn.addEventListener("click", () => {
        playerModal.classList.add("hidden");
      });
    }

    if (savePlayerBtn) {
      savePlayerBtn.addEventListener("click", () => {
        const name = newChildName ? newChildName.value.trim() : "";
        const keys = Array.from(pendingSquadKeys());

        if (!name || keys.length === 0) {
          alert("Please enter a child's name and tick at least one squad.");
          return;
        }

        const squads = keys.map(key => {
          const [team, league] = key.split("|||");
          return { team, league };
        });

        // Saving the same name again tops that child up with the newly ticked
        // squads rather than creating a second child with the same name.
        const existing = players.find(player => player.name.toLowerCase() === name.toLowerCase());
        if (existing) {
          squads.forEach(squad => {
            if (!existing.squads.some(s => squadKey(s) === squadKey(squad))) existing.squads.push(squad);
          });
        } else {
          players.push({ id: makePlayerId(), name, squads });
        }

        if (newChildName) newChildName.value = "";
        squadFilterQuery = "";
        if (squadSearchInput) squadSearchInput.value = "";
        populateSquadPicker(new Set());

        afterPlayersChanged();
        if (playerModal) playerModal.classList.add("hidden");
      });
    }

    if (squadSearchInput) {
      squadSearchInput.addEventListener("input", (event) => {
        squadFilterQuery = event.target.value;
        // Keep anything already ticked ticked while the list is filtered.
        populateSquadPicker(pendingSquadKeys());
      });
    }

    document.querySelectorAll(".league-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedLeague = btn.dataset.league;
        document.querySelectorAll(".league-btn").forEach(b => {
          if (b.dataset.league === selectedLeague) {
            b.className = "league-btn px-4 py-2 rounded-xl text-xs font-bold bg-[#FF6600] text-white shadow-sm flex-shrink-0";
          } else {
            b.className = "league-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 flex-shrink-0";
          }
        });
        renderFixtures();
      });
    });

    document.querySelectorAll(".date-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedDateFilter = btn.dataset.datefilter;
        document.querySelectorAll(".date-btn").forEach(b => {
          if (b.dataset.datefilter === selectedDateFilter) {
            b.className = "date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-900 text-white shadow-sm flex-shrink-0";
          } else {
            b.className = "date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0";
          }
        });
        renderFixtures();
      });
    });

    if (toggleTikiBtn) {
      toggleTikiBtn.addEventListener("click", () => {
        onlyTikiTaka = !onlyTikiTaka;
        if (onlyTikiTaka) {
          toggleTikiBtn.textContent = "✓ Tiki Taka";
          toggleTikiBtn.className = "py-2 px-3 text-xs font-bold rounded-xl bg-[#FF6600] text-white shadow-sm flex-shrink-0 transition-all";
        } else {
          toggleTikiBtn.textContent = "All Teams";
          toggleTikiBtn.className = "py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0 transition-all";
        }
        renderFixtures();
      });
    }

    renderPlayerPills();

    // Proven fetch loader
    fetch("./fixtures_data.json?t=" + Date.now())
      .then(res => res.json())
      .then(data => {
        allFixtures = processFixtures(Array.isArray(data) ? data : []);
        refreshClashes();
        renderPlayerPills();
        renderFixtures();
      })
      .catch(() => {
        fetch("https://raw.githubusercontent.com/gregmurphy-creator/futsal-fixture-scraper/main/fixtures_data.json")
          .then(res => res.json())
          .then(data => {
            allFixtures = processFixtures(Array.isArray(data) ? data : []);
            refreshClashes();
            renderPlayerPills();
            renderFixtures();
          })
          .catch(err => {
            matchCount.textContent = "Feed unavailable";
            fixturesContainer.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-red-500 font-bold">Could not load fixture data.<br><button onclick="location.reload()" class="mt-3 px-3 py-1.5 text-xs bg-[#FF6600] text-white rounded-xl">Retry</button></div>`;
          });
      });
  </script>
</body>
</html>
