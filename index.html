<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiki Taka Fixtures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { background: #f9fafb; } </style>
</head>
<body class="font-sans text-gray-900">
  <div class="max-w-2xl mx-auto px-4 py-10 pb-24">

    <header class="mb-6 text-center">
      <h1 class="text-3xl font-black tracking-tight text-gray-900">
        Tiki <span class="text-[#FF6600]">Taka</span> Fixtures
      </h1>
      <p class="mt-1 text-sm text-gray-500 font-medium">Pick a league</p>
    </header>

    <div class="space-y-4">
      <a href="/futsal/" class="block bg-white rounded-2xl shadow-sm border border-gray-200 p-5 hover:border-[#FF6600] transition-all">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <h2 class="text-lg font-black text-gray-900">Futsal</h2>
            <p class="text-sm text-gray-500 font-medium">Futsal Escocia Winter League</p>
            <p id="futsalMeta" class="mt-1 text-xs text-gray-400">Liga 3 to Liga 7 &middot; Saturdays and Sundays</p>
          </div>
          <span class="text-2xl text-[#FF6600] font-black flex-shrink-0">&rsaquo;</span>
        </div>
      </a>

      <a href="/football/" class="block bg-white rounded-2xl shadow-sm border border-gray-200 p-5 hover:border-[#FF6600] transition-all">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <h2 class="text-lg font-black text-gray-900">Football</h2>
            <p class="text-sm text-gray-500 font-medium">Pitreavie 7s League &middot; 2017s</p>
            <p id="footballMeta" class="mt-1 text-xs text-gray-400">Saturdays at Pitreavie</p>
          </div>
          <span class="text-2xl text-[#FF6600] font-black flex-shrink-0">&rsaquo;</span>
        </div>
      </a>
    </div>

    <p class="mt-8 text-center text-[11px] text-gray-400">
      Fixtures update automatically from each league's own schedule.
    </p>
  </div>

  <script>
    // A line of real detail on each card, so the landing page is worth the tap
    // rather than being a bare menu. Failures stay silent: the static text
    // underneath already says enough.
    function describe(iso, fallback) {
      if (!iso) return fallback;
      const date = new Date(`${iso}T00:00:00`);
      if (isNaN(date.getTime())) return fallback;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const days = Math.round((date - today) / 86400000);
      const when = date.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

      if (days < 0) return `Last played ${when}`;
      if (days === 0) return `Playing today, ${when}`;
      if (days === 1) return `Next up tomorrow, ${when}`;
      return `Next up ${when}`;
    }

    fetch("./pitreavie_data.json?t=" + Date.now())
      .then(response => response.json())
      .then(data => {
        const next = (data.upcoming && data.upcoming.date) || data.fixture_date;
        document.getElementById("footballMeta").textContent =
          describe(next, "Saturdays at Pitreavie");
      })
      .catch(() => {});

    fetch("./fixtures_data.json?t=" + Date.now())
      .then(response => response.json())
      .then(fixtures => {
        if (!Array.isArray(fixtures) || fixtures.length === 0) return;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const upcoming = fixtures
          .map(fixture => fixture.iso_date)
          .filter(Boolean)
          .filter(iso => new Date(`${iso}T00:00:00`) >= today)
          .sort();
        document.getElementById("futsalMeta").textContent =
          describe(upcoming[0], "Liga 3 to Liga 7");
      })
      .catch(() => {});
  </script>
</body>
</html>
