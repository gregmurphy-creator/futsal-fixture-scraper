<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiki Taka - Parent Match Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-6 pb-24">
    
    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-gray-900">
          Tiki Taka <span class="text-[#FF6600]">-</span> Parent Hub
        </h1>
        <p class="text-sm text-gray-500 font-medium">Automated Match Fixtures</p>
      </div>
      <button id="openPlayerModalBtn" class="px-3 py-1.5 text-xs font-bold bg-[#FF6600] text-white rounded-xl shadow-sm hover:bg-[#e05a00] flex items-center gap-1.5 transition-all">
        <span>👤</span> Manage Players
      </button>
    </header>

    <!-- Player Profiles Bar -->
    <div id="playerPillsContainer" class="flex items-center gap-2 overflow-x-auto pb-2 mb-3 scrollbar-none"></div>

    <!-- Quick Team / Venue Search Bar -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3 mb-4">
      <div class="relative flex items-center">
        <span class="absolute left-3 text-gray-400 text-sm">🔍</span>
        <input
          id="teamSearchInput"
          type="text"
          placeholder="Search team or venue (e.g. Swifts, Inverkeithing, Beath)..."
          class="w-full pl-9 pr-10 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#FF6600] transition-all"
        />
        <button
          id="clearSearchBtn"
          class="hidden absolute right-3 text-gray-400 hover:text-gray-700 text-sm font-bold bg-gray-200 hover:bg-gray-300 rounded-full w-5 h-5 flex items-center justify-center leading-none"
        >
          &times;
        </button>
      </div>
    </div>

    <!-- Quick Views (Tiki Taka Default Toggle + Dates) -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3 mb-4">
      <div class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-2 px-1">Quick Views</div>
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="dateFilterGroup">
        <button id="toggleTikiBtn" class="py-2 px-3 text-xs font-bold rounded-xl bg-[#FF6600] text-white shadow-sm flex-shrink-0 transition-all">
          ✓ Tiki Taka
        </button>
        <div class="w-px h-6 bg-gray-200 mx-1 flex-shrink-0"></div>
        <button data-datefilter="ALL" class="date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-900 text-white shadow-sm flex-shrink-0">All Dates</button>
        <button data-datefilter="NEXT_MATCHDAY" class="date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0">Next Matchday</button>
        <button data-datefilter="FOLLOWING_WEEKEND" class="date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0">Following Weekend</button>
      </div>
    </div>

    <!-- League Filter Tabs -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-3 scrollbar-none" id="leagueFilters">
      <button data-league="ALL" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-[#FF6600] text-white shadow-sm flex-shrink-0">All Leagues</button>
      <button data-league="Liga 5" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 flex-shrink-0">Liga 5</button>
      <button data-league="Liga 6" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 flex-shrink-0">Liga 6</button>
      <button data-league="Liga 7" class="league-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 hover:bg-gray-50 border border-gray-200 flex-shrink-0">Liga 7</button>
    </div>

    <!-- Status Subheader -->
    <div class="flex items-center justify-between mb-3 px-1">
      <span id="matchCount" class="text-xs font-medium text-gray-500">Connecting to live feed...</span>
    </div>

    <!-- Fixture Cards List -->
    <div id="fixturesList" class="space-y-3">
      <div class="bg-white rounded-2xl p-10 text-center border border-gray-200">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-[#FF6600] rounded-full mb-3"></div>
        <p class="text-sm font-semibold text-gray-600">Loading live fixtures from GitHub...</p>
      </div>
    </div>
  </div>

  <!-- PLAYER MANAGEMENT MODAL -->
  <div id="playerModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-gray-200">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-black text-gray-900">Manage Players & Children</h3>
        <button id="closePlayerModalBtn" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 mb-5">
        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Add Child to Team</h4>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Child's Name</label>
            <input id="newChildName" type="text" placeholder="e.g. Leo" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#FF6600] bg-white" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Assigned Team & League</label>
            <select id="newChildTeam" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#FF6600] bg-white">
              <option value="">Select team & league...</option>
            </select>
          </div>
          <button id="savePlayerBtn" class="w-full py-2.5 text-xs font-bold bg-[#FF6600] text-white rounded-xl shadow-sm hover:bg-[#e05a00] transition-all">
            Save Player
          </button>
        </div>
      </div>

      <div>
        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Saved Players</h4>
        <div id="savedPlayersList" class="space-y-2 max-h-48 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script>
    let allFixtures = [];
    let searchQuery = "";
    let selectedLeague = "ALL";
    let selectedDateFilter = "ALL";
    let onlyTikiTaka = true;
    let selectedPlayerObj = null;
    let players = [];
    let uniqueScheduledDates = [];

    try {
      players = JSON.parse(localStorage.getItem("tiki_saved_players") || "[]");
    } catch (e) {
      players = [];
    }

    const fixturesContainer = document.getElementById("fixturesList");
    const matchCount = document.getElementById("matchCount");
    const dateFilterGroup = document.getElementById("dateFilterGroup");
    const toggleTikiBtn = document.getElementById("toggleTikiBtn");
    const searchInput = document.getElementById("teamSearchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");

    const playerModal = document.getElementById("playerModal");
    const openPlayerModalBtn = document.getElementById("openPlayerModalBtn");
    const closePlayerModalBtn = document.getElementById("closePlayerModalBtn");
    const savePlayerBtn = document.getElementById("savePlayerBtn");
    const newChildName = document.getElementById("newChildName");
    const newChildTeam = document.getElementById("newChildTeam");
    const savedPlayersList = document.getElementById("savedPlayersList");
    const playerPillsContainer = document.getElementById("playerPillsContainer");

    function isTiki(team = "") {
      const s = String(team || "").toLowerCase();
      return s.includes("tiki") || s.includes("taka");
    }

    function escapeHtml(str = "") {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Resolves and formats match date badges
    function formatDateTimeBadge(dateStr, timeStr) {
      const timeDisplay = timeStr || "TBD";
      let s = String(dateStr || "").trim();

      // If missing or generic, map kickoff round to Saturday, Nov 7
      if (!s || s === "Upcoming" || s.toLowerCase() === "week 1" || s.toLowerCase() === "round 1") {
        return `Sat 7th Nov · ${timeDisplay}`;
      }

      // Check for week/round offsets
      const weekMatch = s.match(/\b(?:Week|Round)\s*(\d+)\b/i);
      if (weekMatch && !s.match(/(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|\d{1,2}[/-]\d{1,2})/i)) {
        const weekNum = parseInt(weekMatch[1], 10);
        const baseDate = new Date(2026, 10, 7); // Nov 7, 2026
        baseDate.setDate(baseDate.getDate() + (weekNum - 1) * 7);
        const day = baseDate.getDate();
        const suf = ["th", "st", "nd", "rd"][(day % 100 - 20) % 10] || ["th", "st", "nd", "rd"][day % 100] || "th";
        const mName = baseDate.toLocaleString("en-GB", { month: "short" });
        return `Sat ${day}${suf} ${mName} · ${timeDisplay}`;
      }

      try {
        const dowMatch = s.match(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\b/i);
        let dow = dowMatch ? dowMatch[1].substring(0, 3) : "";

        const monthMatch = s.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b/i);
        let month = monthMatch ? monthMatch[1].substring(0, 3) : "";

        let dayNum = null;
        const numMatch = s.match(/\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/);

        if (numMatch) {
          dayNum = parseInt(numMatch[1], 10);
          const mIdx = parseInt(numMatch[2], 10);
          const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          if (!month && mIdx >= 1 && mIdx <= 12) month = monthNames[mIdx - 1];

          if (!dow && numMatch[3]) {
            let yr = parseInt(numMatch[3], 10);
            if (yr < 100) yr += 2000;
            const dObj = new Date(yr, mIdx - 1, dayNum);
            if (!isNaN(dObj.getTime())) dow = dObj.toLocaleDateString("en-GB", { weekday: "short" });
          }
        } else {
          if (monthMatch) {
            const pattern = new RegExp('(?:' + monthMatch[0] + '[\\s,]+(\\d{1,2})|(\\d{1,2})[\\s,]+' + monthMatch[0] + ')', 'i');
            const near = s.match(pattern);
            if (near) dayNum = parseInt(near[1] || near[2], 10);
          }
          if (!dayNum) {
            const cleanStr = s.replace(/\b(Week|Round)\s*\d+\b/gi, '');
            const anyNum = cleanStr.match(/\b(\d{1,2})(?:st|nd|rd|th)?\b/);
            if (anyNum) dayNum = parseInt(anyNum[1], 10);
          }
        }

        if (!dow) dow = "Sat";

        let dayStr = "";
        if (dayNum) {
          const suf = ["th", "st", "nd", "rd"];
          const v = dayNum % 100;
          dayStr = dayNum + (suf[(v - 20) % 10] || suf[v] || suf[0]);
        }

        const parts = [dow];
        if (dayStr) parts.push(dayStr);
        if (month) parts.push(month);

        return `${parts.join(" ")} · ${timeDisplay}`;
      } catch (e) {
        return `Sat 7th Nov · ${timeDisplay}`;
      }
    }

    function populateTeamDropdown() {
      if (!newChildTeam) return;
      const teamLeagueMap = new Map();

      allFixtures.forEach(item => {
        const league = item.league || "Unknown";
        if (item.homeTeam && item.homeTeam !== "TBD") {
          teamLeagueMap.set(`${item.homeTeam}|||${league}`, { team: item.homeTeam, league });
        }
        if (item.awayTeam && item.awayTeam !== "TBD") {
          teamLeagueMap.set(`${item.awayTeam}|||${league}`, { team: item.awayTeam, league });
        }
      });

      const sortedEntries = Array.from(teamLeagueMap.values()).sort((a, b) => {
        const cmp = a.team.localeCompare(b.team);
        return cmp !== 0 ? cmp : a.league.localeCompare(b.league);
      });

      newChildTeam.innerHTML = '<option value="">Select team & league...</option>' + 
        sortedEntries.map(entry => {
          const val = `${entry.team}|||${entry.league}`;
          return `<option value="${escapeHtml(val)}">${escapeHtml(entry.team)} - ${escapeHtml(entry.league)}</option>`;
        }).join("");
    }

    function buildDynamicDateButtons() {
      if (!dateFilterGroup) return;
      const datesSet = new Set();
      const monthsSet = new Set();

      allFixtures.forEach(f => {
        if (f && typeof f.date === "string" && f.date !== "Upcoming") {
          datesSet.add(f.date.trim());
          const monthMatch = f.date.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b/i);
          if (monthMatch) {
            monthsSet.add(monthMatch[0].substring(0, 3).toUpperCase());
          }
        }
      });

      uniqueScheduledDates = Array.from(datesSet);

      const monthNames = {
        "JAN": "January", "FEB": "February", "MAR": "March", "APR": "April",
        "MAY": "May", "JUN": "June", "JUL": "July", "AUG": "August",
        "SEP": "September", "OCT": "October", "NOV": "November", "DEC": "December"
      };

      monthsSet.forEach(mKey => {
        const fullMonth = monthNames[mKey] || mKey;
        const btn = document.createElement("button");
        btn.dataset.datefilter = `MONTH_${mKey}`;
        btn.className = "date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0";
        btn.textContent = fullMonth;
        dateFilterGroup.appendChild(btn);
      });

      bindDateButtonEvents();
    }

    function bindDateButtonEvents() {
      document.querySelectorAll(".date-btn").forEach(btn => {
        btn.onclick = () => {
          selectedDateFilter = btn.dataset.datefilter;
          document.querySelectorAll(".date-btn").forEach(b => {
            if (b.dataset.datefilter === selectedDateFilter) {
              b.className = "date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-900 text-white shadow-sm flex-shrink-0";
            } else {
              b.className = "date-btn py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 flex-shrink-0";
            }
          });
          renderFixtures();
        };
      });
    }

    function renderPlayerPills() {
      if (!playerPillsContainer) return;
      if (players.length === 0) {
        playerPillsContainer.innerHTML = `
          <button onclick="document.getElementById('openPlayerModalBtn').click()" class="text-xs font-semibold text-gray-500 bg-white border border-dashed border-gray-300 px-3 py-1.5 rounded-xl hover:border-gray-400">
            + Tap to Add Your Child's Team
          </button>
        `;
        return;
      }

      let html = `
        <button onclick="selectPlayer(null)" class="px-3 py-1.5 text-xs font-bold rounded-xl transition-all flex-shrink-0 ${
          selectedPlayerObj === null ? 'bg-black text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200'
        }">
          All Squads
        </button>
      `;

      players.forEach((p, idx) => {
        const active = selectedPlayerObj && selectedPlayerObj.team === p.team && selectedPlayerObj.league === p.league;
        html += `
          <button onclick="selectPlayer(${idx})" class="px-3 py-1.5 text-xs font-bold rounded-xl transition-all whitespace-nowrap flex items-center gap-1.5 flex-shrink-0 ${
            active ? 'bg-[#FF6600] text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200'
          }">
            <span>👦</span> ${escapeHtml(p.name)} (${escapeHtml(p.team)}${p.league ? ' · ' + escapeHtml(p.league) : ''})
          </button>
        `;
      });

      playerPillsContainer.innerHTML = html;
    }

    window.selectPlayer = function(index) {
      selectedPlayerObj = index !== null ? players[index] : null;
      renderPlayerPills();
      renderFixtures();
    };

    function renderSavedPlayersModalList() {
      if (!savedPlayersList) return;
      if (players.length === 0) {
        savedPlayersList.innerHTML = `<p class="text-xs text-gray-400 italic">No players added yet.</p>`;
        return;
      }

      savedPlayersList.innerHTML = players.map((p, idx) => `
        <div class="flex items-center justify-between p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs">
          <div>
            <span class="font-bold text-gray-900">${escapeHtml(p.name)}</span>
            <span class="text-gray-500 block text-[11px]">${escapeHtml(p.team)} - <span class="text-[#FF6600] font-semibold">${escapeHtml(p.league || '')}</span></span>
          </div>
          <button onclick="deletePlayer(${idx})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">
            Remove
          </button>
        </div>
      `).join("");
    }

    window.deletePlayer = function(index) {
      players.splice(index, 1);
      if (selectedPlayerObj && !players.some(p => p.team === selectedPlayerObj.team && p.league === selectedPlayerObj.league)) {
        selectedPlayerObj = null;
      }
      try {
        localStorage.setItem("tiki_saved_players", JSON.stringify(players));
      } catch (e) {}
      renderSavedPlayersModalList();
      renderPlayerPills();
      renderFixtures();
    };

    function matchDateFilter(itemDateStr, filter) {
      if (filter === "ALL") return true;

      if (filter.startsWith("MONTH_")) {
        const targetMonth = filter.replace("MONTH_", "").toUpperCase();
        return itemDateStr ? itemDateStr.toUpperCase().includes(targetMonth) : false;
      }

      if (filter === "NEXT_MATCHDAY") {
        if (uniqueScheduledDates.length === 0) return true;
        return itemDateStr === uniqueScheduledDates[0];
      }

      if (filter === "FOLLOWING_WEEKEND") {
        if (uniqueScheduledDates.length < 2) return false;
        return itemDateStr === uniqueScheduledDates[1];
      }

      return true;
    }

    function renderFixtures() {
      if (!fixturesContainer || !matchCount) return;

      const q = searchQuery.toLowerCase().trim();
      const hasAnyTiki = allFixtures.some(item => isTiki(item.homeTeam) || isTiki(item.awayTeam));
      const activeTikiFilter = onlyTikiTaka && hasAnyTiki;

      const filtered = allFixtures.filter(item => {
        const home = item.homeTeam || "";
        const away = item.awayTeam || "";
        const venue = item.venue || "";
        const league = item.league || "";

        const matchLeague = selectedLeague === "ALL" || league === selectedLeague;
        const containsTiki = isTiki(home) || isTiki(away);
        
        const matchesSearch = !q || (
          home.toLowerCase().includes(q) ||
          away.toLowerCase().includes(q) ||
          venue.toLowerCase().includes(q)
        );

        let matchesPlayer =
