<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitreavie 7s League - 2017s</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f9fafb; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="font-sans text-gray-900">
  <div class="max-w-2xl mx-auto px-4 py-6 pb-24">

    <header class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4">
      <h1 class="text-2xl font-black tracking-tight text-gray-900">
        Pitreavie <span class="text-[#FF6600]">7s</span> League
        <span class="text-gray-400 font-bold">- 2017s</span>
      </h1>
      <p id="weekHeading" class="text-sm text-gray-500 font-medium">Loading fixtures...</p>
    </header>

    <!-- Says plainly whether these games are still to come or already played -->
    <div id="statusBanner" class="mb-4"></div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3 mb-4">
      <div class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-2 px-1">Show</div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button id="toggleOursBtn" class="py-2 px-3 text-xs font-bold rounded-xl bg-[#FF6600] text-white shadow-sm transition-all">
          &#10003; Tiki Taka
        </button>
        <button id="toggleAllBtn" class="py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all">
          All Teams
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-2 mb-3 px-1">
      <span id="matchCount" class="text-xs font-medium text-gray-500">Connecting...</span>
      <span id="updatedAt" class="text-[11px] text-gray-400"></span>
    </div>

    <div id="fixturesList" class="space-y-3"></div>

    <p class="mt-6 text-center text-[11px] text-gray-400">
      Fixtures read from the league workbook. Pitch numbers as published.
    </p>
  </div>

  <script>
    let data = null;
    let onlyOurs = true;

    const fixturesList = document.getElementById("fixturesList");
    const matchCount = document.getElementById("matchCount");
    const weekHeading = document.getElementById("weekHeading");
    const updatedAt = document.getElementById("updatedAt");
    const toggleOursBtn = document.getElementById("toggleOursBtn");
    const toggleAllBtn = document.getElementById("toggleAllBtn");

    function escapeHtml(value = "") {
      return String(value || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // "9:00 AM" -> minutes, so kick-offs group and sort properly.
    function timeToMinutes(time) {
      const parts = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(time || "").trim());
      if (!parts) return Number.MAX_SAFE_INTEGER;
      let hour = Number(parts[1]) % 12;
      if ((parts[3] || "").toUpperCase() === "PM") hour += 12;
      return hour * 60 + Number(parts[2]);
    }

    function setToggle(ours) {
      onlyOurs = ours;
      const on = "py-2 px-3 text-xs font-bold rounded-xl bg-[#FF6600] text-white shadow-sm transition-all";
      const off = "py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all";
      toggleOursBtn.className = ours ? on : off;
      toggleAllBtn.className = ours ? off : on;
      render();
    }

    // Whole days from today to the fixture date; negative means it has passed.
    function daysUntil(iso) {
      if (!iso) return null;
      const target = new Date(`${iso}T00:00:00`);
      if (isNaN(target.getTime())) return null;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function longDate(iso) {
      const date = new Date(`${iso}T00:00:00`);
      if (isNaN(date.getTime())) return "";
      return date.toLocaleDateString("en-GB",
        { weekday: "long", day: "numeric", month: "long" });
    }

    // The league adds next Saturday's tab on the Wednesday or Thursday before,
    // so for part of each week the newest tab is still last week's games. Say
    // which it is rather than leaving people to work it out from the date.
    function renderStatus() {
      const banner = document.getElementById("statusBanner");
      const days = daysUntil(data && data.fixture_date);

      if (days === null) {
        banner.innerHTML = "";
        return;
      }

      const when = longDate(data.fixture_date);

      if (days >= 0) {
        const lead = days === 0 ? "Today" : days === 1 ? "Tomorrow" : `In ${days} days`;
        banner.innerHTML = `
          <div class="rounded-2xl border border-green-200 bg-green-50 px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-green-700">Coming up</span>
              <span class="text-[11px] font-bold bg-green-600 text-white rounded-lg px-2 py-0.5">${lead}</span>
            </div>
            <p class="mt-1 text-sm font-bold text-green-900">${escapeHtml(when)}</p>
          </div>`;
        return;
      }

      const ago = days === -1 ? "Yesterday" : `${Math.abs(days)} days ago`;
      banner.innerHTML = `
        <div class="rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3">
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-amber-700">Already played</span>
            <span class="text-[11px] font-bold bg-amber-600 text-white rounded-lg px-2 py-0.5">${ago}</span>
          </div>
          <p class="mt-1 text-sm font-bold text-amber-900">${escapeHtml(when)}</p>
          <p class="mt-1 text-xs font-medium text-amber-800">
            This is the most recent list the league has published. The next set usually
            appears on a Wednesday or Thursday, and this page updates on its own.
          </p>
        </div>`;
    }

    function fixtureCard(fixture) {
      const home = escapeHtml(fixture.homeTeam);
      const away = escapeHtml(fixture.awayTeam);
      const ourHome = fixture.isOurs && /tiki taka/i.test(fixture.homeTeam);
      const ourAway = fixture.isOurs && /tiki taka/i.test(fixture.awayTeam);

      return `
        <div class="bg-white rounded-2xl p-4 border ${fixture.isOurs
          ? "border-l-4 border-l-[#FF6600] border-gray-200 shadow-sm"
          : "border-gray-200"}">
          <div class="flex items-center justify-between gap-2 mb-3">
            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gray-900 text-white text-xs font-black">
              Pitch ${escapeHtml(fixture.pitch)}
            </span>
            <div class="flex items-center gap-1.5">
              ${fixture.tier ? `<span class="text-[11px] font-bold text-gray-500 bg-gray-100 border border-gray-200 rounded-lg px-2 py-1">Tier ${escapeHtml(fixture.tier)}</span>` : ""}
              <span class="text-[11px] font-bold bg-orange-50 text-[#FF6600] px-2.5 py-1 rounded-lg border border-orange-100">
                ${escapeHtml(fixture.time)}
              </span>
            </div>
          </div>

          <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${ourHome ? "bg-[#FF6600]" : "bg-gray-300"}"></span>
                <span class="text-sm truncate ${ourHome ? "font-black text-gray-900" : "font-semibold text-gray-800"}">${home}</span>
              </div>
              ${ourHome ? '<span class="text-[10px] font-extrabold uppercase bg-orange-100 text-[#FF6600] px-1.5 py-0.5 rounded flex-shrink-0">Tiki</span>' : ""}
            </div>

            <div class="flex items-center gap-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest px-1">
              <span class="h-px bg-gray-200 flex-1"></span><span>vs</span><span class="h-px bg-gray-200 flex-1"></span>
            </div>

            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${ourAway ? "bg-[#FF6600]" : "bg-gray-300"}"></span>
                <span class="text-sm truncate ${ourAway ? "font-black text-gray-900" : "font-semibold text-gray-700"}">${away}</span>
              </div>
              ${ourAway ? '<span class="text-[10px] font-extrabold uppercase bg-orange-100 text-[#FF6600] px-1.5 py-0.5 rounded flex-shrink-0">Tiki</span>' : ""}
            </div>
          </div>
        </div>`;
    }

    function render() {
      if (!data) return;

      const fixtures = (data.fixtures || [])
        .filter(fixture => !onlyOurs || fixture.isOurs)
        .slice()
        .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time)
          || String(a.pitch).localeCompare(String(b.pitch), undefined, { numeric: true }));

      renderStatus();
      matchCount.textContent = `Showing ${fixtures.length} ${fixtures.length === 1 ? "match" : "matches"}`;

      if (fixtures.length === 0) {
        fixturesList.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-gray-200">
            <p class="text-gray-500 font-medium">No Tiki Taka fixtures listed for this week.</p>
            <button onclick="document.getElementById('toggleAllBtn').click()"
                    class="mt-3 px-3 py-1.5 text-xs font-bold bg-[#FF6600] text-white rounded-xl shadow-sm">
              Show all teams
            </button>
          </div>`;
        return;
      }

      // Group by kick-off, so the pitch numbers for a given time sit together.
      const groups = [];
      fixtures.forEach(fixture => {
        const last = groups[groups.length - 1];
        if (last && last.time === fixture.time) last.items.push(fixture);
        else groups.push({ time: fixture.time, items: [fixture] });
      });

      fixturesList.innerHTML = groups.map(group => `
        <div class="sticky top-0 z-10 -mx-1 px-1 py-2 bg-gray-50/95 backdrop-blur-sm">
          <div class="flex items-baseline justify-between gap-2">
            <h2 class="text-sm font-black text-gray-900">${escapeHtml(group.time)}</h2>
            <span class="text-[11px] font-bold text-gray-500">
              ${group.items.length} ${group.items.length === 1 ? "match" : "matches"}
            </span>
          </div>
        </div>
        ${group.items.map(fixtureCard).join("")}
      `).join("");
    }

    toggleOursBtn.addEventListener("click", () => setToggle(true));
    toggleAllBtn.addEventListener("click", () => setToggle(false));

    fetch("./pitreavie_data.json?t=" + Date.now())
      .then(response => response.json())
      .then(payload => {
        data = payload;
        weekHeading.textContent = payload.heading || payload.week_tab || "";
        if (payload.updated) {
          const when = new Date(payload.updated);
          if (!isNaN(when.getTime())) {
            updatedAt.textContent = "Updated " + when.toLocaleString("en-GB",
              { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
          }
        }
        render();
      })
      .catch(() => {
        matchCount.textContent = "Feed unavailable";
        fixturesList.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-red-500 font-bold border border-gray-200">
            Could not load fixtures.
            <button onclick="location.reload()" class="mt-3 block mx-auto px-3 py-1.5 text-xs bg-[#FF6600] text-white rounded-xl">Retry</button>
          </div>`;
      });
  </script>
</body>
</html>
