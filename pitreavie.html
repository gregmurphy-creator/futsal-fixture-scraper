<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitreavie 7s League - 2017s</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { background: #f9fafb; } </style>
</head>
<body class="font-sans text-gray-900">
  <div class="max-w-2xl mx-auto px-4 py-6 pb-24">

    <header class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4">
      <h1 class="text-2xl font-black tracking-tight text-gray-900">
        Pitreavie <span class="text-[#FF6600]">7s</span> League
        <span class="text-gray-400 font-bold">- 2017s</span>
      </h1>
      <p id="weekHeading" class="text-sm text-gray-500 font-medium">Loading fixtures...</p>
    </header>

    <div id="viewTabs" class="flex items-center gap-1.5 mb-3"></div>
    <div id="statusBanner" class="mb-4"></div>

    <div id="showCard" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3 mb-4 hidden">
      <div class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-2 px-1">Show</div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button id="toggleOursBtn" class="py-2 px-3 text-xs font-bold rounded-xl bg-[#FF6600] text-white shadow-sm transition-all">&#10003; Tiki Taka</button>
        <button id="toggleAllBtn" class="py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all">All Teams</button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-2 mb-3 px-1">
      <span id="matchCount" class="text-xs font-medium text-gray-500">Connecting...</span>
      <span id="updatedAt" class="text-[11px] text-gray-400"></span>
    </div>

    <div id="fixturesList" class="space-y-3"></div>
  </div>

  <script>
    let data = null;
    let onlyOurs = true;
    let view = "upcoming";   // "upcoming" | "last"

    const el = (id) => document.getElementById(id);
    const fixturesList = el("fixturesList"), matchCount = el("matchCount");
    const weekHeading = el("weekHeading"), updatedAt = el("updatedAt");
    const statusBanner = el("statusBanner"), viewTabs = el("viewTabs"), showCard = el("showCard");

    // Every 7s game is at the same ground, so the venue is fixed rather than
    // read per fixture. Coordinates from the league's own map link, with its
    // Facebook click-tracking stripped off.
    const VENUE = {
      // Short on the card so it sits on one line beside the calendar button,
      // like the futsal page; the full address goes into the calendar entry.
      label: "Pitreavie",
      address: "Queensferry Road, Dunfermline",
      postcode: "KY11 8PP",
      lat: 56.052997,
      lng: -3.430008,
    };
    const VENUE_MAP_URL =
      `https://www.google.com/maps/search/?api=1&query=${VENUE.lat},${VENUE.lng}`;

    // Kick-offs here run on the hour, so an hour is the slot length.
    const SLOT_MINUTES = 60;

    function escapeHtml(value = "") {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function timeToMinutes(time) {
      const parts = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(time || "").trim());
      if (!parts) return Number.MAX_SAFE_INTEGER;
      let hour = Number(parts[1]) % 12;
      if ((parts[3] || "").toUpperCase() === "PM") hour += 12;
      return hour * 60 + Number(parts[2]);
    }

    function daysUntil(iso) {
      if (!iso) return null;
      const target = new Date(`${iso}T00:00:00`);
      if (isNaN(target.getTime())) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function shortDate(iso) {
      const date = new Date(`${iso}T00:00:00`);
      return isNaN(date.getTime()) ? ""
        : date.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }

    function longDate(iso) {
      const date = new Date(`${iso}T00:00:00`);
      return isNaN(date.getTime()) ? ""
        : date.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    }

    // The league publishes next Saturday's tab on the Wednesday or Thursday
    // before, so the newest tab is sometimes the week ahead and sometimes the
    // week just gone. Work out which, and fall back to the availability tab
    // for the week ahead when its fixtures are not out yet.
    function views() {
      const publishedAhead = (daysUntil(data.fixture_date) ?? -1) >= 0;
      const published = {
        kind: "fixtures", date: data.fixture_date,
        heading: data.heading, fixtures: data.fixtures || [],
      };
      const prior = data.previous_week ? {
        kind: "fixtures", date: data.previous_week.date,
        heading: data.previous_week.heading, fixtures: data.previous_week.fixtures || [],
      } : null;

      if (publishedAhead) return { upcoming: published, last: prior };

      const pending = data.upcoming ? {
        kind: "tbc", date: data.upcoming.date,
        heading: data.upcoming.week_label, teams: data.upcoming.teams || {},
      } : null;
      return { upcoming: pending, last: published };
    }

    function renderTabs(available) {
      const on = "flex-1 py-2.5 px-3 text-xs font-bold rounded-xl bg-gray-900 text-white shadow-sm";
      const off = "flex-1 py-2.5 px-3 text-xs font-bold rounded-xl bg-white text-gray-700 border border-gray-200 hover:bg-gray-50";

      viewTabs.innerHTML = ["upcoming", "last"].map(name => {
        const entry = available[name];
        if (!entry) return "";
        const label = name === "upcoming" ? "This Saturday" : "Last week";
        return `<button onclick="setView('${name}')" class="${view === name ? on : off}">
            ${label}<span class="block text-[10px] font-semibold opacity-70">${escapeHtml(shortDate(entry.date))}</span>
          </button>`;
      }).join("");
    }

    function renderBanner(entry) {
      if (!entry) { statusBanner.innerHTML = ""; return; }
      const days = daysUntil(entry.date);
      const when = longDate(entry.date);

      if (entry.kind === "tbc") {
        const playing = Object.entries(entry.teams).filter(([, s]) => String(s).toUpperCase() === "Y");
        statusBanner.innerHTML = `
          <div class="rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-blue-700">Not published yet</span>
              <span class="text-[11px] font-bold bg-blue-600 text-white rounded-lg px-2 py-0.5">
                ${days === 0 ? "Today" : days === 1 ? "Tomorrow" : `In ${days} days`}
              </span>
            </div>
            <p class="mt-1 text-sm font-bold text-blue-900">${escapeHtml(when)}</p>
            <p class="mt-1 text-xs font-medium text-blue-800">
              The league usually posts fixtures on a Wednesday or Thursday. From the
              availability sheet, <strong>${playing.length} of ${Object.keys(entry.teams).length}</strong>
              teams are down to play - opponents, times and pitches follow when it is published.
            </p>
          </div>`;
        return;
      }

      if (days >= 0) {
        statusBanner.innerHTML = `
          <div class="rounded-2xl border border-green-200 bg-green-50 px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-green-700">Coming up</span>
              <span class="text-[11px] font-bold bg-green-600 text-white rounded-lg px-2 py-0.5">
                ${days === 0 ? "Today" : days === 1 ? "Tomorrow" : `In ${days} days`}
              </span>
            </div>
            <p class="mt-1 text-sm font-bold text-green-900">${escapeHtml(when)}</p>
          </div>`;
        return;
      }

      statusBanner.innerHTML = `
        <div class="rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3">
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-amber-700">Already played</span>
            <span class="text-[11px] font-bold bg-amber-600 text-white rounded-lg px-2 py-0.5">
              ${days === -1 ? "Yesterday" : `${Math.abs(days)} days ago`}
            </span>
          </div>
          <p class="mt-1 text-sm font-bold text-amber-900">${escapeHtml(when)}</p>
        </div>`;
    }

    // Google Calendar wants a local start and end plus the zone, which keeps
    // it right either side of the October clock change.
    function calendarUrl(fixture, isoDate) {
      if (!isoDate) return null;
      const minutes = timeToMinutes(fixture.time);
      if (minutes === Number.MAX_SAFE_INTEGER) return null;

      const stamp = (offset) => {
        const at = new Date(`${isoDate}T00:00:00`);
        at.setMinutes(minutes + offset);
        const pad = (n) => String(n).padStart(2, "0");
        return `${at.getFullYear()}${pad(at.getMonth() + 1)}${pad(at.getDate())}`
             + `T${pad(at.getHours())}${pad(at.getMinutes())}00`;
      };

      const params = new URLSearchParams({
        action: "TEMPLATE",
        text: `${fixture.homeTeam} v ${fixture.awayTeam} (Pitreavie 7s)`,
        dates: `${stamp(0)}/${stamp(SLOT_MINUTES)}`,
        ctz: "Europe/London",
        location: `${VENUE.label}, ${VENUE.address}, ${VENUE.postcode}`,
        details: `Pitch ${fixture.pitch}${fixture.tier ? ` - Tier ${fixture.tier}` : ""}`,
      });
      return `https://calendar.google.com/calendar/render?${params}`;
    }

    function fixtureCard(fixture, isoDate) {
      const calendar = calendarUrl(fixture, isoDate);
      const ourHome = fixture.isOurs && /tiki taka/i.test(fixture.homeTeam);
      const ourAway = fixture.isOurs && /tiki taka/i.test(fixture.awayTeam);
      const side = (name, mine, weight) => `
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${mine ? "bg-[#FF6600]" : "bg-gray-300"}"></span>
            <span class="text-sm truncate ${mine ? "font-black text-gray-900" : weight}">${escapeHtml(name)}</span>
          </div>
          ${mine ? '<span class="text-[10px] font-extrabold uppercase bg-orange-100 text-[#FF6600] px-1.5 py-0.5 rounded flex-shrink-0">Tiki</span>' : ""}
        </div>`;

      return `
        <div class="bg-white rounded-2xl p-4 border ${fixture.isOurs
          ? "border-l-4 border-l-[#FF6600] border-gray-200 shadow-sm" : "border-gray-200"}">
          <div class="flex items-center justify-between gap-2 mb-3">
            <span class="inline-flex items-center px-3 py-1.5 rounded-xl bg-gray-900 text-white text-xs font-black">
              Pitch ${escapeHtml(fixture.pitch)}
            </span>
            <div class="flex items-center gap-1.5">
              ${fixture.tier ? `<span class="text-[11px] font-bold text-gray-500 bg-gray-100 border border-gray-200 rounded-lg px-2 py-1">Tier ${escapeHtml(fixture.tier)}</span>` : ""}
              <span class="text-[11px] font-bold bg-orange-50 text-[#FF6600] px-2.5 py-1 rounded-lg border border-orange-100">${escapeHtml(fixture.time)}</span>
            </div>
          </div>
          <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 space-y-2">
            ${side(fixture.homeTeam, ourHome, "font-semibold text-gray-800")}
            <div class="flex items-center gap-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest px-1">
              <span class="h-px bg-gray-200 flex-1"></span><span>vs</span><span class="h-px bg-gray-200 flex-1"></span>
            </div>
            ${side(fixture.awayTeam, ourAway, "font-semibold text-gray-700")}
          </div>

          <div class="pt-3 flex flex-wrap items-center justify-between gap-2">
            <a href="${VENUE_MAP_URL}" target="_blank" rel="noopener noreferrer"
               class="text-xs text-gray-500 font-medium hover:text-gray-700">
              &#128205; ${escapeHtml(VENUE.label)} &middot; ${escapeHtml(VENUE.postcode)}
            </a>
            ${calendar ? `<a href="${calendar}" target="_blank" rel="noopener noreferrer"
               class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-orange-500 hover:bg-orange-600 text-white">+ Calendar</a>` : ""}
          </div>
        </div>`;
    }

    // Placeholder for a team we know is playing but whose fixture is not out.
    function pendingCard(team, status) {
      const available = String(status).toUpperCase() === "Y";
      return `
        <div class="bg-white rounded-2xl p-4 border ${available
          ? "border-l-4 border-l-blue-400 border-gray-200" : "border-gray-200 opacity-70"}">
          <div class="flex items-center justify-between gap-2 mb-3">
            <span class="inline-flex items-center px-3 py-1.5 rounded-xl ${available
              ? "bg-gray-200 text-gray-600" : "bg-gray-100 text-gray-400"} text-xs font-black">
              Pitch TBC
            </span>
            <span class="text-[11px] font-bold px-2.5 py-1 rounded-lg border ${available
              ? "bg-blue-50 text-blue-700 border-blue-200" : "bg-gray-100 text-gray-500 border-gray-200"}">
              ${available ? "Time TBC" : escapeHtml(status)}
            </span>
          </div>
          <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 space-y-2">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 bg-[#FF6600]"></span>
              <span class="text-sm font-black text-gray-900 truncate">${escapeHtml(team)}</span>
            </div>
            <div class="flex items-center gap-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest px-1">
              <span class="h-px bg-gray-200 flex-1"></span><span>vs</span><span class="h-px bg-gray-200 flex-1"></span>
            </div>
            <div class="flex items-center gap-2.5">
              <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 bg-gray-300"></span>
              <span class="text-sm font-semibold ${available ? "text-gray-500" : "text-gray-400"} italic">
                ${available ? "Opponent to be confirmed" : "Not playing this week"}
              </span>
            </div>
          </div>
        </div>`;
    }

    function render() {
      if (!data) return;
      const available = views();
      if (!available[view]) view = available.upcoming ? "upcoming" : "last";
      const entry = available[view];

      renderTabs(available);
      renderBanner(entry);
      weekHeading.textContent = entry ? entry.heading : "";

      if (!entry) {
        showCard.classList.add("hidden");
        matchCount.textContent = "Nothing to show";
        fixturesList.innerHTML = "";
        return;
      }

      if (entry.kind === "tbc") {
        showCard.classList.add("hidden");
        const teams = Object.entries(entry.teams)
          .sort(([a], [b]) => a.localeCompare(b));
        const playing = teams.filter(([, s]) => String(s).toUpperCase() === "Y");
        matchCount.textContent = `${playing.length} of ${teams.length} teams down to play`;
        fixturesList.innerHTML = teams.map(([team, status]) => pendingCard(team, status)).join("");
        return;
      }

      showCard.classList.remove("hidden");
      const fixtures = entry.fixtures
        .filter(fixture => !onlyOurs || fixture.isOurs)
        .slice()
        .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time)
          || String(a.pitch).localeCompare(String(b.pitch), undefined, { numeric: true }));

      matchCount.textContent = `Showing ${fixtures.length} ${fixtures.length === 1 ? "match" : "matches"}`;

      if (fixtures.length === 0) {
        fixturesList.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-gray-200">
            <p class="text-gray-500 font-medium">No Tiki Taka fixtures in this week.</p>
            <button onclick="document.getElementById('toggleAllBtn').click()"
                    class="mt-3 px-3 py-1.5 text-xs font-bold bg-[#FF6600] text-white rounded-xl shadow-sm">Show all teams</button>
          </div>`;
        return;
      }

      const groups = [];
      fixtures.forEach(fixture => {
        const last = groups[groups.length - 1];
        if (last && last.time === fixture.time) last.items.push(fixture);
        else groups.push({ time: fixture.time, items: [fixture] });
      });

      fixturesList.innerHTML = groups.map(group => `
        <div class="sticky top-0 z-10 -mx-1 px-1 py-2 bg-gray-50/95 backdrop-blur-sm">
          <div class="flex items-baseline justify-between gap-2">
            <h2 class="text-sm font-black text-gray-900">${escapeHtml(group.time)}</h2>
            <span class="text-[11px] font-bold text-gray-500">${group.items.length} ${group.items.length === 1 ? "match" : "matches"}</span>
          </div>
        </div>
        ${group.items.map(fixture => fixtureCard(fixture, entry.date)).join("")}`).join("");
    }

    window.setView = function(name) { view = name; render(); };

    function setToggle(ours) {
      onlyOurs = ours;
      const on = "py-2 px-3 text-xs font-bold rounded-xl bg-[#FF6600] text-white shadow-sm transition-all";
      const off = "py-2 px-3 text-xs font-bold rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all";
      el("toggleOursBtn").className = ours ? on : off;
      el("toggleAllBtn").className = ours ? off : on;
      render();
    }
    el("toggleOursBtn").addEventListener("click", () => setToggle(true));
    el("toggleAllBtn").addEventListener("click", () => setToggle(false));

    fetch("./pitreavie_data.json?t=" + Date.now())
      .then(response => response.json())
      .then(payload => {
        data = payload;
        if (payload.updated) {
          const when = new Date(payload.updated);
          if (!isNaN(when.getTime())) {
            updatedAt.textContent = "Updated " + when.toLocaleString("en-GB",
              { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
          }
        }
        render();
      })
      .catch(() => {
        matchCount.textContent = "Feed unavailable";
        fixturesList.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-red-500 font-bold border border-gray-200">
            Could not load fixtures.
            <button onclick="location.reload()" class="mt-3 block mx-auto px-3 py-1.5 text-xs bg-[#FF6600] text-white rounded-xl">Retry</button>
          </div>`;
      });
  </script>
</body>
</html>
